<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Internships, colleges and ATS-ready resumes built only from verified data.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Launchpad">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2309090b%27/%3E%3Cpath d=%27M9 21l5-5 3.5 3.5L23 12M18.5 12H23v4.5%27 stroke=%27white%27 stroke-width=%272.6%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <title>Launchpad — Mason Ngo</title>
  <script>
    // Apply the saved theme before first paint (no white flash in dark mode).
    try {
      var t = JSON.parse(localStorage.getItem("rb.settings") || "{}").theme;
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#dashboard" aria-label="Launchpad home"><span class="logo"></span><span class="brand-title">Launchpad</span></a>
      <button class="search-btn" id="open-palette" type="button"></button>
      <nav id="nav"></nav>
      <div id="more-menu" class="more-menu" hidden></div>
      <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="Theme"></div>
    </aside>
    <main id="app" tabindex="-1"></main>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print-root"></div>

  <script src="js/backup.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/companies.js"></script>
  <script src="js/internships.js"></script>
  <script src="js/colleges.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/chances.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/features.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/convo.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/ats.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
