<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Builder — Mason Ngo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">MN</span>
      <div>
        <div class="brand-title">Resume Builder</div>
        <div class="brand-sub">Verified data only · no hallucination</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="build">Build</button>
      <button data-view="skills">Skill Bank</button>
      <button data-view="master">Master Resume</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status"></div>
  <div id="print-root"></div>

  <script src="js/profile.js"></script>
  <script src="js/companies.js"></script>
  <script src="js/internships.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>

</html>
